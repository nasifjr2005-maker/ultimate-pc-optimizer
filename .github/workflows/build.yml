name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Convert logo to ICO
        shell: pwsh
        run: |
          python -c "from PIL import Image; im=Image.open('assets/panel50.png').convert('RGBA'); im.save('assets/panel50.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build application
        shell: cmd
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin
          --name "PNL50 PC OPTIMIZER PRO"
          --icon assets/panel50.ico
          --add-data "assets;assets"
          app.py

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/PANEL50Optimizer.iss

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: PNL50-PC-OPTIMIZER-PRO
          path: installer/output/PNL50-PC-OPTIMIZER-PRO-Setup.exe
          if-no-files-found: error

      - name: Create GitHub release asset
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PNL50 PC OPTIMIZER PRO v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: installer/output/PNL50-PC-OPTIMIZER-PRO-Setup.exe
